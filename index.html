<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Astra Prep — Practice Smarter, Prepare Better, Perform Your Best</title>
    <meta
      name="description"
      content="A personalised practice and assessment platform for JEE, NEET, Class 10 and Class 12 students. Practise by chapter, attempt real exam-pattern mock tests, analyse your performance and fix every mistake."
    />
    <meta name="keywords" content="JEE, NEET, Class 10, Class 12, mock test, practice questions, online test series, exam preparation, question bank, performance analytics" />
    <meta name="author" content="Astra Prep" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://astraprep.app/" />

    <!-- Progressive web app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#573ec9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211a45" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />
    <meta name="application-name" content="Astra Prep" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Astra Prep" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="mask-icon" href="./favicon.svg" color="#573ec9" />
    <link rel="apple-touch-icon" href="./icon-maskable.svg" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Astra Prep" />
    <meta property="og:title" content="Astra Prep — Practice Smarter, Prepare Better" />
    <meta
      property="og:description"
      content="Practice and assessment platform for JEE, NEET, Class 10 and Class 12. Topic-wise practice, timed mock tests, performance analytics and an automatic mistake book."
    />
    <meta property="og:url" content="https://astraprep.app/" />
    <meta property="og:image" content="./icon-maskable.svg" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Astra Prep — Practice Smarter, Prepare Better" />
    <meta
      name="twitter:description"
      content="Practice and assessment platform for JEE, NEET, Class 10 and Class 12 students."
    />
    <meta name="twitter:image" content="./icon-maskable.svg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Astra Prep",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "description": "A personalised practice and assessment platform for JEE, NEET, Class 10 and Class 12 students.",
        "url": "https://astraprep.app/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "featureList": [
          "Topic-wise practice",
          "Timed mock tests",
          "Performance analytics",
          "Mistake book",
          "Faculty question bank",
          "Admin dashboard"
        ]
      }
    </script>

    <style>
      /* Pre-mount splash. Lives inside #root and is replaced when React renders,
         so there is no white flash and no extra DOM once the app is up. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7f8fa;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #app-splash .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6d55e2, #4832a5);
        display: grid;
        place-items: center;
        box-shadow: 0 10px 24px -10px rgba(87, 62, 201, 0.55);
        animation: splash-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-splash .name {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1a1e28;
      }
      #app-splash .name span { color: #573ec9; }
      #app-splash .bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: #e7e5fd;
        overflow: hidden;
      }
      #app-splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #573ec9;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .mark, #app-splash .bar i { animation: none; }
      }
      #app-noscript {
        max-width: 30rem;
        margin: 15vh auto;
        padding: 2rem;
        border: 1px solid #dfe3ea;
        border-radius: 16px;
        background: #fff;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        color: #2b3140;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Astra Prep">
        <div class="mark">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 17 10 11l4 4 6-7" />
            <path d="M15 5h5v5" />
          </svg>
        </div>
        <p class="name">Astra<span>Prep</span></p>
        <div class="bar"><i></i></div>
      </div>
    </div>

    <noscript>
      <div id="app-noscript">
        <h1 style="font-size: 1.1rem; margin: 0 0 0.5rem">JavaScript is required</h1>
        <p style="font-size: 0.875rem; color: #525d72; margin: 0">
          Astra Prep is an interactive practice and assessment application. Please enable JavaScript
          in your browser settings and reload this page.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      /* Register the service worker for offline use.
         Skipped on file:// and on the Vite dev server, where it would only
         get in the way of hot module replacement. */
      (function () {
        var isSecure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        var isDevServer = /^(5173|5174|3000|4173)$/.test(location.port);
        if (!('serviceWorker' in navigator) || !isSecure || isDevServer) return;

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {
            /* Offline support is an enhancement — failure is not fatal. */
          });
        });
      })();
    </script>
  </body>
</html>
